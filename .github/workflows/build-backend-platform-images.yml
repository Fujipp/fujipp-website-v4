name: Build Backend Platform Images

# Manual-only image build for the backend platform host. This intentionally does
# not deploy anywhere, so it is safe to run from a feature branch without rolling
# live backend services.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag, or SHA to build images from"
        required: true
        default: "main"

concurrency:
  group: build-backend-platform-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Resolve source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Lowercase owner for GHCR
        id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/fujipp-backend:${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=backend-platform-backend
          cache-to: type=gha,scope=backend-platform-backend,mode=max

      - name: Build and push billing
        uses: docker/build-push-action@v6
        with:
          context: ./services/billing-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/fujipp-billing:${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=backend-platform-billing
          cache-to: type=gha,scope=backend-platform-billing,mode=max

      - name: Build and push voucher
        uses: docker/build-push-action@v6
        with:
          context: ./services/voucher-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/fujipp-voucher:${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=backend-platform-voucher
          cache-to: type=gha,scope=backend-platform-voucher,mode=max

      - name: Build and push runtime
        uses: docker/build-push-action@v6
        with:
          context: ./services
          file: ./services/bot-runtime-service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/fujipp-runtime:${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=backend-platform-runtime
          cache-to: type=gha,scope=backend-platform-runtime,mode=max

      - name: Write deployment summary
        run: |
          {
            echo "## Backend Platform image tags"
            echo
            echo "Built from: ${{ inputs.source_ref }} (${{ steps.source.outputs.sha }})"
            echo
            echo '```dotenv'
            echo "BACKEND_IMAGE=${REGISTRY}/${{ steps.vars.outputs.owner }}/fujipp-backend:${{ steps.source.outputs.sha }}"
            echo "BILLING_IMAGE=${REGISTRY}/${{ steps.vars.outputs.owner }}/fujipp-billing:${{ steps.source.outputs.sha }}"
            echo "VOUCHER_IMAGE=${REGISTRY}/${{ steps.vars.outputs.owner }}/fujipp-voucher:${{ steps.source.outputs.sha }}"
            echo "RUNTIME_IMAGE=${REGISTRY}/${{ steps.vars.outputs.owner }}/fujipp-runtime:${{ steps.source.outputs.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
