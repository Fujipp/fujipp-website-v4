name: Deploy Backend

# Builds the backend + billing images, pushes them to GHCR (public), then rolls
# the VPS stack to the new commit. Only main, and only when backend files change.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'services/**'
      - 'docker/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner for GHCR
        id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/fujipp-backend:latest
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/fujipp-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build & push billing
        uses: docker/build-push-action@v6
        with:
          context: ./services/billing-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/fujipp-billing:latest
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/fujipp-billing:${{ github.sha }}
          cache-from: type=gha,scope=billing
          cache-to: type=gha,scope=billing,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner for GHCR
        id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy compose file to VPS
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          scp -P "${SSH_PORT:-22}" -i ~/.ssh/id_deploy \
            docker/docker-compose.prod.yml \
            "$SSH_USER@$SSH_HOST:/opt/fujipp/docker-compose.yml"

      - name: Render .env and roll the stack
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          BACKEND_ENV_FILE: ${{ secrets.BACKEND_ENV_FILE }}
          BACKEND_IMAGE: ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/fujipp-backend:${{ github.sha }}
          BILLING_IMAGE: ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/fujipp-billing:${{ github.sha }}
        run: |
          # base64-encode the secret so newlines/quotes survive the SSH hop intact
          ENV_B64=$(printf '%s' "$BACKEND_ENV_FILE" | base64 -w0)
          ssh -p "${SSH_PORT:-22}" -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" \
            "ENV_B64='$ENV_B64' BACKEND_IMAGE='$BACKEND_IMAGE' BILLING_IMAGE='$BILLING_IMAGE' bash -se" <<'REMOTE'
          set -euo pipefail
          cd /opt/fujipp
          umask 077

          # App secrets (single source of truth = the BACKEND_ENV_FILE GitHub secret)
          printf '%s' "$ENV_B64" | base64 -d > .env

          # Pin the images for this deploy (enables clean rollback by SHA)
          {
            echo "BACKEND_IMAGE=$BACKEND_IMAGE"
            echo "BILLING_IMAGE=$BILLING_IMAGE"
          } >> .env

          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
          docker compose ps
          REMOTE
