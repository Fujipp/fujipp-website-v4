name: Deploy Frontend

# Deploys the built SPA to the DirectAdmin shared host (fujipp.com) over FTP.
# The shared plan has no SSH, so we upload dist/ with lftp.
# Only main, and only when frontend files change.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # bun.lock drifts from package.json (vue beta + overrides), so don't freeze it here.
      - run: bun install

      - name: Write production env
        # FRONTEND_ENV_FILE holds VITE_API_BASE_URL, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
        run: printf '%s' "${{ secrets.FRONTEND_ENV_FILE }}" > .env.production

      - name: Build
        run: bun run build

      - name: Restore legacy cached assets
        # Keep previously-deployed hashed chunks available so clients still running an
        # older index.html can load their lazy route chunks during the rollover.
        run: |
          if [ -d public/assets ]; then
            mkdir -p dist/assets
            cp -n public/assets/*.js dist/assets/
          fi

      - name: Deploy dist/ over FTP, then verify the entry chunk serves as JS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
          SITE_URL: https://fujipp.com
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lftp

          # The entry module index.html points at. If THIS file is missing on the
          # server, every page fails with "Expected a JavaScript module … got text/html"
          # because the SPA fallback serves index.html for the absent asset.
          entry="$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)"
          echo "Entry chunk: ${entry:-<none found>}"

          # Upload serially (parallel FTPS data connections on this shared host silently
          # drop large files — that is the flaky-deploy root cause). clobber on so changed
          # hashed files are overwritten. Old hashed assets are kept (no --delete) so
          # clients on a previous index.html can still load their lazy chunks.
          upload() {
            lftp -c "
              set ftp:ssl-allow true;
              set ftp:ssl-protect-data true;
              set ssl:verify-certificate no;
              set net:max-retries 3;
              set net:timeout 30;
              set net:reconnect-interval-base 5;
              set xfer:clobber on;
              open -u '$FTP_USER','$FTP_PASSWORD' -p ${FTP_PORT:-21} '$FTP_HOST';
              mirror -R --parallel=1 --verbose dist/ '$FTP_REMOTE_DIR';
            "
          }

          # Upload, then confirm the live server actually serves the entry chunk as
          # JavaScript. Retry the whole upload if a transfer dropped — a flaky deploy
          # now fails loudly (and self-heals) instead of reporting a false success.
          for attempt in 1 2 3; do
            echo "=== Upload attempt $attempt ==="
            upload || echo "lftp exited non-zero on attempt $attempt"
            if [ -n "$entry" ]; then
              ct="$(curl -s -o /dev/null -w '%{content_type}' "$SITE_URL$entry" || true)"
              echo "Entry served as: $ct"
              case "$ct" in *javascript*) echo "Verified ✅"; exit 0;; esac
              echo "Entry not served as JS yet — retrying upload…"; sleep 8
            else
              echo "Could not parse entry chunk from index.html — skipping verify"; exit 0
            fi
          done
          echo "::error::Deploy incomplete — entry chunk never served as JavaScript"
          exit 1
