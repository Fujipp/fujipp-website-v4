name: Deploy Frontend

# Deploys the built SPA to the DirectAdmin shared host (fujipp.com) over FTP.
# The shared plan has no SSH, so we upload dist/ with lftp.
# Only main, and only when frontend files change.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # bun.lock drifts from package.json (vue beta + overrides), so don't freeze it here.
      - run: bun install

      - name: Write production env
        # FRONTEND_ENV_FILE holds VITE_API_BASE_URL, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
        run: printf '%s' "${{ secrets.FRONTEND_ENV_FILE }}" > .env.production

      - name: Build
        run: bun run build

      - name: Restore legacy cached assets
        # Keep previously-deployed hashed chunks available so clients still running an
        # older index.html can load their lazy route chunks during the rollover.
        run: |
          if [ -d public/assets ]; then
            mkdir -p dist/assets
            cp -n public/assets/*.js dist/assets/
          fi

      - name: Deploy dist/ over FTP (lftp mirror)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lftp
          # Try FTPS if the server offers it, fall back to plain FTP; don't verify the cert.
          # Keep old hashed assets so cached index/main chunks from a previous deploy
          # can still load their lazy route chunks instead of receiving index.html.
          lftp -c "
            set ftp:ssl-allow true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set net:max-retries 2;
            set net:timeout 20;
            open -u '$FTP_USER','$FTP_PASSWORD' -p ${FTP_PORT:-21} '$FTP_HOST';
            mirror -R --parallel=4 --verbose dist/ '$FTP_REMOTE_DIR';
          "
