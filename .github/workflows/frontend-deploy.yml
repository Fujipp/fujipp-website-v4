name: Deploy Frontend

# Deploys the built SPA to the DirectAdmin shared host (fujipp.com) over FTP.
# The shared plan has no SSH, so we upload dist/ with lftp.
# Only main, and only when frontend files change.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '!frontend/AGENTS.md'
      - '!frontend/docs/**'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # vue + @vue/* are pinned to an exact beta (not the moving `beta` tag), so the
      # lockfile is reproducible — freeze it so prod builds the exact deps committed.
      - run: bun install --frozen-lockfile

      - name: Write production env
        # FRONTEND_ENV_FILE holds VITE_API_BASE_URL, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
        run: printf '%s' "${{ secrets.FRONTEND_ENV_FILE }}" > .env.production

      - name: Exclude previously deployed chunks from build input
        # Vite copies public/** into dist/. The public/assets folder only stores
        # old hashed chunks for compatibility, so remove it in CI before build.
        # The FTP deploy does not delete remote files, so those old chunks stay
        # available on the server without slowing every new release.
        run: rm -rf public/assets

      - name: Build
        run: bun run build

      - name: Deploy current dist/ over FTP, then verify current JS chunks
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
          SITE_URL: https://fujipp.com
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lftp

          # The entry module index.html points at. If THIS file is missing on the
          # server, every page fails with "Expected a JavaScript module … got text/html"
          # because the SPA fallback serves index.html for the absent asset.
          entry="$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)"
          echo "Entry chunk: ${entry:-<none found>}"

          # Upload serially (parallel FTPS data connections on this shared host silently
          # drop large files — that is the flaky-deploy root cause). The build output is
          # current-release only; old hashed assets are kept on the server because this
          # mirror does not delete remote files.
          #
          # CRITICAL ordering: this mirror EXCLUDES index.html (-X index.html). We upload
          # every hashed chunk first, prove they all serve, and only then put index.html
          # (see below). That makes the rollover atomic from a client's view: the live
          # index.html keeps pointing at the OLD chunks (still present, never deleted)
          # until the NEW chunks are fully on disk — no white-screen window mid-deploy.
          upload() {
            lftp -c "
              set ftp:ssl-allow true;
              set ftp:ssl-protect-data true;
              set ssl:verify-certificate no;
              set net:max-retries 3;
              set net:timeout 30;
              set net:reconnect-interval-base 5;
              set xfer:clobber on;
              open -u '$FTP_USER','$FTP_PASSWORD' -p ${FTP_PORT:-21} '$FTP_HOST';
              mirror -R --parallel=1 --verbose -X index.html dist/ '$FTP_REMOTE_DIR';
            "
          }

          # Put the entry document LAST, after every chunk is confirmed serving. This is
          # the single flip that makes new chunks go live, so it must never run before
          # heal_missing() has passed.
          put_index() {
            lftp -c "
              set ftp:ssl-allow true;
              set ftp:ssl-protect-data true;
              set ssl:verify-certificate no;
              set net:max-retries 3;
              set net:timeout 30;
              set xfer:clobber on;
              open -u '$FTP_USER','$FTP_PASSWORD' -p ${FTP_PORT:-21} '$FTP_HOST';
              put -O '$FTP_REMOTE_DIR' 'dist/index.html';
            "
          }

          # Re-upload a single asset the mirror dropped (shared-host FTPS silently loses
          # some transfers — verifying only the entry chunk let dropped lazy chunks slip
          # through as false successes). Puts one local file into the remote assets dir.
          put_one() {
            lftp -c "
              set ftp:ssl-allow true;
              set ftp:ssl-protect-data true;
              set ssl:verify-certificate no;
              set net:max-retries 3;
              set net:timeout 30;
              set xfer:clobber on;
              open -u '$FTP_USER','$FTP_PASSWORD' -p ${FTP_PORT:-21} '$FTP_HOST';
              put -O '$FTP_REMOTE_DIR/assets' 'dist/assets/$1';
            "
          }

          # Verify every JS chunk from the current build serves as JavaScript (not the
          # SPA fallback HTML), re-uploading any that don't. Returns the count still
          # missing. Historical chunks stay on the server but are not copied into dist/
          # or re-verified during normal deploys.
          heal_missing() {
            miss=0
            for f in dist/assets/*.js; do
              [ -e "$f" ] || continue
              name="$(basename "$f")"
              ct="$(curl -s -o /dev/null -w '%{content_type}' "$SITE_URL/assets/$name" || true)"
              case "$ct" in
                *javascript*) ;;
                *) echo "  ↻ missing on server: $name ($ct) — re-uploading"; put_one "$name" || true; miss=$((miss + 1));;
              esac
            done
            return $miss
          }

          # Upload every chunk (NOT index.html), then confirm the current asset set serves
          # as JS. Retry the upload + targeted re-put of any dropped chunk — a flaky
          # deploy now self-heals every missing chunk and only fails loudly when one
          # truly can't be delivered. Only once all chunks pass do we flip index.html,
          # so a half-uploaded deploy never strands clients on a missing chunk.
          for attempt in 1 2 3 4; do
            echo "=== Upload attempt $attempt (chunks only) ==="
            upload || echo "lftp exited non-zero on attempt $attempt"
            if heal_missing; then
              echo "All JS chunks served as JavaScript ✅ — flipping index.html"
              put_index || { echo "::error::index.html upload failed"; exit 1; }
              if [ -n "$entry" ]; then
                echo "Entry now served as: $(curl -s -o /dev/null -w '%{content_type}' "$SITE_URL$entry" || true)"
              fi
              echo "Deploy complete ✅"; exit 0
            fi
            echo "Re-uploaded missing chunk(s) — re-verifying after a pause…"; sleep 8
          done
          echo "::error::Deploy incomplete — some JS chunks never served as JavaScript (index.html left untouched)"
          exit 1
