name: Deploy Frontend

# Deploys the built SPA to the DirectAdmin shared host (fujipp.com) over FTP.
# The shared plan has no SSH, so we upload dist/ with lftp.
# Only main, and only when frontend files change.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
      - '!frontend/README.md'
      - '!frontend/AGENTS.md'
      - '!frontend/docs/**'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # vue + @vue/* are pinned to an exact beta (not the moving `beta` tag), so the
      # lockfile is reproducible — freeze it so prod builds the exact deps committed.
      - run: bun install --frozen-lockfile

      - name: Write production env
        # FRONTEND_ENV_FILE holds VITE_API_BASE_URL, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
        run: printf '%s' "${{ secrets.FRONTEND_ENV_FILE }}" > .env.production

      - name: Exclude previously deployed chunks from build input
        # Vite copies public/** into dist/. The public/assets folder only stores
        # old hashed chunks for compatibility, so remove it in CI before build.
        # The FTP deploy does not delete remote files, so those old chunks stay
        # available on the server without slowing every new release.
        run: rm -rf public/assets

      - name: Build
        run: bun run build

      - name: Deploy changed dist/ files over FTP, then verify current assets
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
          SITE_URL: https://fujipp.com
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lftp

          # The entry module index.html points at. If THIS file is missing on the
          # server, every page fails with "Expected a JavaScript module … got text/html"
          # because the SPA fallback serves index.html for the absent asset.
          entry="$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)"
          echo "Entry chunk: ${entry:-<none found>}"

          # Upload serially (parallel FTPS data connections on this shared host silently
          # drop large files — that is the flaky-deploy root cause). Do not use FTP mirror:
          # listing and comparing hundreds of remote public files plus historical Vite
          # chunks made every release take minutes. A SHA-256 release manifest selects
          # the exact changed paths locally, so FTP only receives files that need a put.
          #
          # CRITICAL ordering: index.html is excluded from the manifest. We upload every
          # changed file first, prove the current assets serve, and only then put index.html
          # (see below). That makes the rollover atomic from a client's view: the live
          # index.html keeps pointing at the OLD chunks (still present, never deleted)
          # until the NEW chunks are fully on disk — no white-screen window mid-deploy.
          upload() {
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              echo "  ↑ changed file: $path"
              put_one "$path" || return 1
            done < "$changed_files"
          }

          # Put the entry document LAST, after every chunk is confirmed serving. This is
          # the single flip that makes new chunks go live, so it must never run before
          # heal_missing() has passed.
          put_index() {
            lftp -c "
              set ftp:ssl-allow true;
              set ftp:ssl-protect-data true;
              set ssl:verify-certificate no;
              set net:max-retries 3;
              set net:timeout 30;
              set xfer:clobber on;
              open -u '$FTP_USER','$FTP_PASSWORD' -p ${FTP_PORT:-21} '$FTP_HOST';
              put -O '$FTP_REMOTE_DIR' 'dist/index.html';
            "
          }

          # Upload one release path. mkdir -p also supports newly introduced public
          # directories without requiring a remote mirror/listing operation.
          put_one() {
            path="$1"
            directory="$(dirname "$path")"
            if [ "$directory" = "." ]; then
              remote_directory="$FTP_REMOTE_DIR"
            else
              remote_directory="$FTP_REMOTE_DIR/$directory"
            fi
            lftp -c "
              set ftp:ssl-allow true;
              set ftp:ssl-protect-data true;
              set ssl:verify-certificate no;
              set net:max-retries 3;
              set net:timeout 30;
              set xfer:clobber on;
              open -u '$FTP_USER','$FTP_PASSWORD' -p ${FTP_PORT:-21} '$FTP_HOST';
              mkdir -pf '$remote_directory';
              put -O '$remote_directory' 'dist/$path';
            "
          }

          # Publish the exact file hashes only after the release has passed HTTP
          # verification. The next deployment downloads this tiny file instead of
          # listing hundreds of historical chunks over FTP.
          put_manifest() {
            lftp -c "
              set ftp:ssl-allow true;
              set ftp:ssl-protect-data true;
              set ssl:verify-certificate no;
              set net:max-retries 3;
              set net:timeout 30;
              set xfer:clobber on;
              open -u '$FTP_USER','$FTP_PASSWORD' -p ${FTP_PORT:-21} '$FTP_HOST';
              put -O '$FTP_REMOTE_DIR' '$manifest_upload';
            "
          }

          # Verify every asset in the current release directly over FTP. The release
          # manifest tells us what changed, but it cannot prove that an unchanged path
          # still exists remotely. One FTP session keeps this complete check quick and
          # prevents index.html from ever pointing at a missing dynamic chunk.
          heal_missing() {
            verify_directory="$(mktemp -d)"
            download_commands=""
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              download_commands="$download_commands get '$FTP_REMOTE_DIR/assets/$name' -o '$verify_directory/$name';"
            done < "$verify_assets"

            if [ -n "$download_commands" ]; then
              lftp -c "
                set ftp:ssl-allow true;
                set ftp:ssl-protect-data true;
                set ssl:verify-certificate no;
                set net:max-retries 1;
                set net:timeout 20;
                open -u '$FTP_USER','$FTP_PASSWORD' -p ${FTP_PORT:-21} '$FTP_HOST';
                $download_commands
              " || true
            fi

            miss=0
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              if cmp -s "dist/assets/$name" "$verify_directory/$name"; then
                continue
              fi
              echo "  ↻ missing on server: $name — re-uploading"
              put_one "assets/$name" || true
              miss=$((miss + 1))
            done < "$verify_assets"
            rm -rf "$verify_directory"
            return $miss
          }

          # Compare the local release against the tiny manifest from the last verified
          # release. With no previous manifest, use an empty baseline so the first run
          # uploads the complete release instead of incorrectly treating every file as
          # already deployed.
          current_manifest="$(mktemp)"
          manifest_upload="$(mktemp -d)/.frontend-files.sha256"
          previous_manifest="$(mktemp)"
          changed_files="$(mktemp)"
          verify_assets="$(mktemp)"
          find dist -type f ! -name 'index.html' -print0 \
            | sort -z \
            | xargs -0 -r sha256sum \
            | sed 's#  dist/#  #' > "$current_manifest"
          cp "$current_manifest" "$manifest_upload"

          if ! lftp -c "
            set ftp:ssl-allow true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set net:max-retries 3;
            set net:timeout 30;
            open -u '$FTP_USER','$FTP_PASSWORD' -p ${FTP_PORT:-21} '$FTP_HOST';
            get '$FTP_REMOTE_DIR/.frontend-files.sha256' -o '$previous_manifest';
          "; then
            echo "No previous file manifest; uploading the complete current release."
            : > "$previous_manifest"
          fi

          awk 'NR == FNR { old[$2] = $1; next } old[$2] != $1 { print $2 }' \
            "$previous_manifest" "$current_manifest" > "$changed_files"
          echo "Files requiring FTP upload: $(wc -l < "$changed_files" | tr -d ' ')"

          find dist/assets -maxdepth 1 -type f -printf '%f\n' > "$verify_assets"
          sort -u -o "$verify_assets" "$verify_assets"
          echo "Current assets requiring FTP verification: $(wc -l < "$verify_assets" | tr -d ' ')"

          # Upload changed files (NOT index.html), then confirm the current asset set
          # serves. Retry the upload + targeted re-put of any dropped file — a flaky
          # deploy now self-heals every missing chunk and only fails loudly when one
          # truly can't be delivered. Only once all chunks pass do we flip index.html,
          # so a half-uploaded deploy never strands clients on a missing chunk.
          for attempt in 1 2 3 4; do
            echo "=== Upload attempt $attempt (chunks only) ==="
            upload || echo "lftp exited non-zero on attempt $attempt"
            if heal_missing; then
              echo "All current assets are serving correctly ✅ — flipping index.html"
              put_index || { echo "::error::index.html upload failed"; exit 1; }
              put_manifest || { echo "::error::file manifest upload failed"; exit 1; }
              if [ -n "$entry" ]; then
              echo "Entry now served as: $(curl -s -H 'Cache-Control: no-cache' -o /dev/null -w '%{content_type}' "$SITE_URL$entry?deploy=$GITHUB_SHA" || true)"
              fi
              echo "Deploy complete ✅"; exit 0
            fi
            echo "Re-uploaded missing chunk(s) — re-verifying after a pause…"; sleep 8
          done
          echo "::error::Deploy incomplete — some current assets never served correctly (index.html left untouched)"
          exit 1
