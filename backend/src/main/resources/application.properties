spring.application.name=backend

spring.config.import=optional:file:.env[.properties]

# Database (Supabase PostgreSQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Supabase pooler runs in session mode (port 5432) with a small client cap (~15).
# Keep Hikari well under it so DevTools restarts / a second service don't exhaust slots.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Disable Spring Session — auth is stateless JWT, not server-side sessions
spring.session.store-type=none

# Supabase JWT secret (found in Supabase Dashboard > Settings > API > JWT Secret)
supabase.jwt.secret=${SUPABASE_JWT_SECRET}
supabase.url=${SUPABASE_URL}

# CORS — comma-separated list of allowed origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}

# Billing service (internal) — must match billing-service's BILLING_SERVICE_TOKEN
billing.base-url=${BILLING_BASE_URL:http://localhost:8081}
billing.service-token=${BILLING_SERVICE_TOKEN}

# AES-256-GCM key for encrypting customer secrets (Discord tokens).
# MUST equal the orchestrator's BOT_SECRET_KEY (32 bytes, 64-char hex or base64).
# Empty default so a missing key doesn't crash boot — bot features just won't work
# until it's set (SecretCipher validates lazily, on first use).
bot.secret-key=${BOT_SECRET_KEY:}

# Bot runtime orchestrator (internal) — token must match its SERVICE_TOKEN
runtime.base-url=${RUNTIME_BASE_URL:http://localhost:8090}
runtime.service-token=${RUNTIME_SERVICE_TOKEN:}

# Daily renewal/expiry automation. OFF by default — it charges wallets + stops live
# bots unattended; enable deliberately after review. Cron is Asia/Bangkok.
runtime.automation.enabled=${RUNTIME_AUTOMATION_ENABLED:false}
runtime.automation.cron=${RUNTIME_AUTOMATION_CRON:0 0 3 * * *}

# Surface error reasons (e.g. why a bot start was rejected) in the JSON response.
server.error.include-message=always

# SlipOK slip verification
slipok.base-url=${SLIPOK_BASE_URL:https://api.slipok.com}
slipok.branch-id=${SLIPOK_BRANCH_ID}
slipok.api-key=${SLIPOK_API_KEY}

# PromptPay receiver id (shop mobile / national id / e-wallet) for top-up QR
promptpay.id=${PROMPTPAY_ID}

# Slip upload limits (verified again in SlipFileValidator)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
