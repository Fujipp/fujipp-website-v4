spring.application.name=billing-service

spring.config.import=optional:file:.env[.properties]

# Database (same Supabase PostgreSQL as the platform; tables live in the `billing` schema)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:30000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:600000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=billing

# Separate port from the main backend
server.port=${BILLING_SERVER_PORT:8081}

# Shared secret the main backend must send in X-Service-Token on every request.
# If unset, the service rejects all requests.
billing.service-token=${BILLING_SERVICE_TOKEN}

# AES-256-GCM key for encrypting feature config secrets (must equal the main
# backend's and orchestrator's BOT_SECRET_KEY — 32 bytes as 64-char hex or base64).
# Empty default so a missing key doesn't crash boot — validated lazily on first use.
bot.secret-key=${BOT_SECRET_KEY:}

# Grace days after a runtime period ends before the automation sweep releases its seat
# (auto-renew keeps retrying the charge during this window).
automation.runtime-grace-days=${AUTOMATION_RUNTIME_GRACE_DAYS:3}
