spring.application.name=voucher-service

spring.config.import=optional:file:.env[.properties]

# Database (same Supabase PostgreSQL as the platform; tables live in the `voucher` schema)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:30000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:600000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=voucher

# Separate port from the main backend (8080) and billing (8081)
server.port=${VOUCHER_SERVER_PORT:8082}

# Shared secret callers must send in x-api-key. If unset, the service rejects all requests.
voucher.service-token=${VOUCHER_SERVICE_TOKEN:}

# Lock redeem to bots we run on the platform: when true (default), the X-Client-Id must
# be a real bots.bot_instances subject id (so any shop that buys the top-up feature works
# automatically) or an allow-listed id below. Set false for local/dev with no bot rows.
voucher.client-check.enabled=${VOUCHER_CLIENT_CHECK_ENABLED:true}

# Optional always-allow X-Client-Id values (comma-separated) for non-bot internal callers.
# Additive to the platform check above — usually empty.
voucher.allowed-client-ids=${VOUCHER_ALLOWED_CLIENT_IDS:}

# TrueMoney upstream
voucher.tw.user-agent=${TW_USER_AGENT:tmn-redeemer/1.0}
voucher.tw.timeout-ms=${TW_TIMEOUT_MS:12000}
# Adapter: 'truewallet' (real upstream) or 'mock' (no real redeem)
voucher.adapter=${VOUCHER_ADAPTER:truewallet}

# Only expose health for the container healthcheck
management.endpoints.web.exposure.include=health
