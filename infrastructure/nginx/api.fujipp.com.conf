# REFERENCE ONLY — this is already configured and live on the VPS.
#
# The server at 154.215.14.227 is shared with pm2 Discord bots and already runs
# nginx with a Let's Encrypt cert for api.fujipp.com, proxying to 127.0.0.1:3600.
# CI does NOT manage nginx; do not run a bootstrap that rewrites it. This file just
# documents the expected reverse-proxy config so the repo is self-describing.
#
# The backend container publishes host port 3600 (-> container 8080), so nginx's
# existing proxy_pass http://127.0.0.1:3600 lands on the Spring Boot app.

server {
    server_name api.fujipp.com;

    # Slip uploads (backend caps requests at 6MB; nginx is generous).
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3600;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate     /etc/letsencrypt/live/api.fujipp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.fujipp.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = api.fujipp.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    listen [::]:80;
    server_name api.fujipp.com;
    return 404;
}
